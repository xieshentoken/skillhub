<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skillhub</title>
<style>
  :root{
    --bg:#f5f5f7; --panel:#ffffff; --panel2:#fafafc; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.12);
    --text:#1d1d1f; --muted:rgba(0,0,0,.8); --dim:rgba(0,0,0,.48);
    --accent:#0071e3; --link:#0066cc; --green:#34c759; --amber:#ff9f0a; --red:#ff3b30; --gray:#d2d2d7;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
    --display:-apple-system,"SF Pro Display","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.47 var(--sans);letter-spacing:-.374px}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:var(--sans);letter-spacing:-.224px}
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(0,0,0,.8);color:#fff;
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  }
  .gn{max-width:1120px;margin:0 auto;min-height:48px;padding:6px 22px;
      display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
  .gn-brand{font:600 17px/1 var(--display);letter-spacing:-.4px;color:#fff;white-space:nowrap}
  .gn-brand span{font-weight:400;opacity:.72}
  nav{display:flex;gap:2px;flex:1 1 420px;flex-wrap:wrap;align-items:center;min-width:0}
  nav button{
    border:0;background:transparent;color:rgba(255,255,255,.8);
    font:400 12px/1 var(--sans);letter-spacing:0;padding:7px 9px;border-radius:980px;cursor:pointer}
  nav button:hover{color:#fff}
  nav button.active{color:#fff;background:rgba(255,255,255,.14)}
  .gn-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
  .gn-time{font:400 12px/1.33 var(--sans);color:rgba(255,255,255,.48);letter-spacing:-.12px}
  header .ck{color:rgba(255,255,255,.72);font-size:12px}
  header button{
    background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);
    border-radius:980px;padding:5px 14px;cursor:pointer;font-size:12px;line-height:1.3}
  header button:hover{background:rgba(255,255,255,.12)}
  #refresh{background:var(--accent);border-color:transparent;color:#fff}
  #refresh:hover{background:#0077ed}
  .page-hero{background:#000;color:#fff;text-align:center;padding:72px 24px 56px}
  .page-hero .eyebrow{margin:0 0 10px;font:600 12px/1.33 var(--sans);letter-spacing:.08em;
      text-transform:uppercase;color:rgba(255,255,255,.56)}
  .page-hero h1{margin:0;font:600 56px/1.07 var(--display);letter-spacing:-.28px}
  .page-hero .sub{margin:12px 0 0;font:400 21px/1.19 var(--display);letter-spacing:.2px;color:rgba(255,255,255,.8)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:28px 12px 0}
  .chip{background:rgba(255,255,255,.08);border:0;border-radius:980px;padding:6px 14px;
        font:400 12px/1.33 var(--sans);color:rgba(255,255,255,.72);letter-spacing:-.12px}
  .chip b{color:#fff;font-weight:600}
  .paths{font:12px/1.5 var(--mono);color:rgba(255,255,255,.4);margin:18px 0 0;word-break:break-all}
  .paths .mono{color:rgba(255,255,255,.56)}
  main{padding:48px 22px 96px;max-width:1120px;margin:0 auto}
  .section-head{margin:0 0 28px}
  .section-head h2{margin:0;font:600 40px/1.1 var(--display);letter-spacing:-.2px}
  .section-head p{margin:8px 0 0;font:400 17px/1.47 var(--sans);color:var(--dim)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:var(--panel);border:0;border-radius:12px;padding:24px 22px;
        box-shadow:rgba(0,0,0,.04) 0 1px 2px}
  .card h3{margin:0;font:700 21px/1.19 var(--display);letter-spacing:.23px;
           display:flex;align-items:center;gap:8px}
  .dotc{width:8px;height:8px;border-radius:50%;flex:none}
  .badge{font:400 12px/1.33 var(--sans);letter-spacing:-.12px;border:0;border-radius:980px;
         padding:3px 9px;background:#f5f5f7;color:var(--dim)}
  .badge.copy{color:#c93400;background:rgba(255,159,10,.12)}
  .badge.warn{color:var(--red);background:rgba(255,59,48,.1)}
  .badge.ok{color:#248a3d;background:rgba(52,199,89,.12)}
  .dir{font:12px/1.5 var(--mono);color:var(--dim);word-break:break-all;margin:10px 0 16px}
  .nums{display:flex;gap:14px 20px;flex-wrap:wrap;font:400 12px/1.3 var(--sans);color:var(--dim);margin-bottom:14px}
  .nums span{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .nums b{font:600 21px/1.1 var(--display);margin:0;color:var(--text);letter-spacing:-.2px}
  .bar{height:4px;border-radius:980px;background:var(--gray);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .meta{font:12px/1.7 var(--sans);color:var(--dim);margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  input[type=text],select,input[type=number],textarea{
    background:var(--panel2);border:3px solid rgba(0,0,0,.04);color:var(--text);
    border-radius:11px;padding:8px 14px;font:14px/1.3 var(--sans);outline:none}
  input[type=text]:focus,select:focus,input[type=number]:focus,textarea:focus{
    border-color:transparent;box-shadow:0 0 0 2px var(--accent)}
  input[type=text]{min-width:240px}
  label.ck{font:400 14px/1.29 var(--sans);color:var(--dim);display:flex;gap:6px;align-items:center;cursor:pointer}
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border-radius:12px;overflow:hidden}
  th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;letter-spacing:-.224px}
  th{color:var(--dim);font-weight:600;background:var(--panel2);position:sticky;top:48px;white-space:nowrap;font-size:12px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f5f5f7}
  tbody tr:last-child td{border-bottom:0}
  td.mono,span.mono{font:12px/1.4 var(--mono);letter-spacing:0}
  .risk{display:inline-block;font:600 11px/1.3 var(--sans);border-radius:980px;padding:2px 8px;margin:1px 3px 1px 0;
        background:rgba(255,59,48,.1);color:var(--red);border:0}
  .risk.none{background:transparent;color:var(--dim)}
  .sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;cursor:default}
  .s-linked{background:var(--green)} .s-conflict{background:var(--amber)} .s-not_linked{background:var(--gray)}
  .s-broken,.s-copy_broken,.s-copy_drift,.s-store_drift{background:var(--red)}
  .desc{color:var(--dim);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #drawer{position:fixed;top:0;right:-580px;width:560px;max-width:94vw;height:100vh;z-index:50;
          background:#fff;transition:right .28s cubic-bezier(.4,0,.2,1);
          display:flex;flex-direction:column;box-shadow:rgba(0,0,0,.22) 3px 5px 30px}
  #drawer.open{right:0}
  #drawer .dhead{padding:18px 22px;display:flex;align-items:center;gap:10px}
  #drawer .dhead h2{margin:0;font:600 21px/1.19 var(--display);flex:1;letter-spacing:.2px}
  #drawer .dbody{overflow:auto;padding:8px 22px 32px;flex:1}
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
  #mask.show{display:block}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:8px 16px;font-size:14px;margin-bottom:20px}
  .kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-all}
  .sect{font:600 12px/1.33 var(--sans);color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:24px 0 10px}
  .filelist{font:12px/1.5 var(--mono);color:var(--dim);max-height:260px;overflow:auto;
            border:0;border-radius:12px;padding:12px 14px;background:#f5f5f7}
  .filelist div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .projline{display:flex;gap:8px;align-items:flex-start;padding:10px 0;font-size:14px;border-bottom:1px solid var(--line)}
  .projline:last-of-type{border-bottom:0}
  .projline .mono{color:var(--dim);font-size:11px;word-break:break-all}
  .empty{color:var(--dim);text-align:center;padding:64px 0;font-size:17px}
  .note{font:400 12px/1.5 var(--sans);color:var(--dim);margin-top:14px;letter-spacing:-.12px}
  .note b{color:var(--muted);font-weight:600}
  .formrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .formrow input,.formrow textarea{background:var(--panel2);border:3px solid rgba(0,0,0,.04);color:var(--text);border-radius:11px;padding:8px 12px}
  .formrow textarea{width:100%;min-height:180px;font:12px/1.5 var(--mono)}
  .choice-grid,.group-members{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .choice-grid{max-height:160px;overflow:auto;padding:8px;border:0;border-radius:12px;background:#f5f5f7}
  .choice-item{padding:4px 8px;border-radius:8px}
  .choice-item:hover{background:#fff}
  .panel{background:var(--panel);border:0;border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:rgba(0,0,0,.04) 0 1px 2px}
  .panel h3{margin:0 0 12px;font:700 21px/1.19 var(--display)}
  .danger{color:var(--red)}.success{color:#248a3d}
  .diag-list{display:grid;gap:6px;margin:8px 0}
  button{background:#f5f5f7;color:var(--text);border:0;border-radius:8px;padding:8px 15px;cursor:pointer;font-size:14px}
  button:hover{background:#e8e8ed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .smallbtn{padding:5px 11px;font-size:12px;border-radius:980px;color:var(--link);background:transparent}
  .smallbtn:hover{background:rgba(0,113,227,.08);text-decoration:none}
  .view-switch{display:flex;gap:4px;background:#f5f5f7;padding:3px;border-radius:980px;margin-bottom:16px;width:fit-content}
  .view-switch button{border-radius:980px;padding:6px 14px;font-size:13px;background:transparent;color:var(--dim)}
  .view-switch button.active{background:#1d1d1f;color:#fff}
  .graph-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .graph-stage{display:grid;grid-template-columns:1fr 250px;background:#1e1e1e;border-radius:12px;overflow:hidden;min-height:640px}
  .graph-canvas-wrap{position:relative;min-height:640px}
  #graphCanvas{width:100%;height:640px;display:block;background:#1e1e1e;touch-action:none;cursor:grab}
  #graphCanvas.dragging{cursor:grabbing}
  #graphHint{position:absolute;left:0;top:0;pointer-events:none;background:rgba(20,20,20,.92);color:#fff;
             padding:4px 8px;border-radius:6px;font:12px/1.3 var(--sans);white-space:nowrap;
             transform:translate(-50%,-140%);box-shadow:0 4px 16px rgba(0,0,0,.4)}
  #graphInfo{background:#111;color:rgba(255,255,255,.86);padding:18px 16px;font:13px/1.45 var(--sans);
             border-left:1px solid rgba(255,255,255,.08);overflow:auto}
  #graphInfo h3{margin:0 0 6px;font:600 17px/1.2 var(--display);color:#fff}
  #graphInfo .k{color:rgba(255,255,255,.44);font-size:12px}
  #graphInfo .nb{margin:8px 0 0;padding:0;list-style:none}
  #graphInfo .nb li{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}
  .graph-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font:12px var(--sans);color:var(--dim)}
  .graph-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  #graphStat{color:var(--dim);font-size:12px}
  .graph-size{display:flex;align-items:center;gap:8px;font:12px/1.3 var(--sans);color:var(--dim);white-space:nowrap}
  .graph-size input[type=range]{width:100px;accent-color:var(--accent);vertical-align:middle}
  .graph-size output{min-width:2.6em;color:var(--text);font-variant-numeric:tabular-nums}
  @media (max-width:734px){
    .page-hero h1{font-size:40px;line-height:1.1}
    .page-hero .sub{font-size:19px}
    .page-hero{padding:48px 20px 40px}
    main{padding:32px 16px 72px}
    .section-head h2{font-size:28px}
    nav{order:3;flex:1 1 100%;padding:4px 0 8px}
    .gn-time,#exportCsv{display:none}
    .graph-stage{grid-template-columns:1fr;min-height:0}
    .graph-canvas-wrap,#graphCanvas{height:480px;min-height:480px}
    #graphInfo{min-height:140px;border-left:0;border-top:1px solid rgba(255,255,255,.08)}
  }
</style>
</head>
<body>
<header>
  <div class="gn">
    <div class="gn-brand">skill<span>hub</span></div>
    <nav id="tabs">
      <button data-t="ov" class="active">概览</button>
      <button data-t="sk">Skills</button>
      <button data-t="mc">MCP</button>
      <button data-t="bk">备份</button>
      <button data-t="mt">分发</button>
      <button data-t="lg">设置</button>
    </nav>
    <div class="gn-actions">
      <span class="gn-time" id="genat"></span>
      <label class="ck"><input type="checkbox" id="autoRefresh"> 自动刷新</label>
      <button id="exportCsv">导出 CSV</button>
      <button id="refresh">刷新</button>
    </div>
  </div>
</header>
<div class="page-hero">
  <p class="eyebrow">Local console</p>
  <h1>本机技能中枢</h1>
  <p class="sub">一份中央库，投影到每一个 agent。</p>
  <div class="chips" id="chips"></div>
  <div class="paths" id="paths"></div>
</div>
<main>
  <section id="tab-ov"></section>
  <section id="tab-sk" hidden>
    <div class="section-head">
      <h2>中央库</h2>
      <p>列表检索，或用关系图查看分组、投影、版本与 MCP 连接。</p>
    </div>
    <div class="view-switch" id="skViewSwitch">
      <button type="button" data-sk-view="list" class="active">列表</button>
      <button type="button" data-sk-view="graph">关系图</button>
    </div>
    <div id="skListPane">
      <div class="toolbar">
        <input type="text" id="q" placeholder="搜索名称 / 描述 / skill_id…">
        <select id="fAgent"><option value="">全部 agent 投影状态</option></select>
        <select id="fState">
          <option value="">任意状态</option>
          <option value="linked">已投影</option>
          <option value="trial">试用 UL</option>
          <option value="conflict">冲突</option>
          <option value="broken">断链</option>
          <option value="store_drift">中央库漂移</option>
          <option value="copy_drift">copy 漂移</option>
          <option value="not_linked">未投影</option>
        </select>
        <label class="ck"><input type="checkbox" id="fRisk"> 仅看有风险的</label>
        <span class="note" id="skCount"></span>
      </div>
      <div id="skTable"></div>
      <p class="note"><b>图例</b>
        <span class="sdot s-linked"></span>已投影
        <span class="sdot s-conflict"></span>冲突
        <span class="sdot s-not_linked"></span>未投影。点击一行查看详情。</p>
    </div>
    <div id="skGraph" hidden>
      <div class="graph-toolbar">
        <input type="text" id="graphQ" placeholder="搜索 skill / agent / 分组…">
        <label class="ck"><input type="checkbox" id="graphOrphans" checked> 孤立节点</label>
        <label class="ck"><input type="checkbox" id="graphGroups" checked> 分组</label>
        <label class="ck"><input type="checkbox" id="graphVersion" checked> 版本</label>
        <label class="ck"><input type="checkbox" id="graphMcp" checked> MCP</label>
        <label class="ck"><input type="checkbox" id="graphLocal"> 仅看关联</label>
        <label class="graph-size">节点直径 <input type="range" id="graphSize" min="10" max="200" step="5" value="40"> <output id="graphSizeVal">40%</output></label>
        <label class="graph-size">发光 <input type="range" id="graphGlow" min="0" max="100" step="5" value="55"> <output id="graphGlowVal">55%</output></label>
        <label class="graph-size">透明度 <input type="range" id="graphAlpha" min="5" max="100" step="5" value="85"> <output id="graphAlphaVal">85%</output></label>
        <button type="button" id="graphReset" class="smallbtn">复位视图</button>
        <span id="graphStat"></span>
      </div>
      <div class="graph-stage">
        <div class="graph-canvas-wrap">
          <canvas id="graphCanvas"></canvas>
          <div id="graphHint" hidden></div>
        </div>
        <aside id="graphInfo"><p class="k">每个 skill 是一个点，已投影到 agent 的画连线。悬停看名称，单击高亮邻居，双击打开详情。</p></aside>
      </div>
      <div class="graph-legend">
        <span><i style="background:#7aa2f7"></i>Agent</span>
        <span><i style="background:#c0caf5"></i>Skill</span>
        <span><i style="background:#ff3b30"></i>风险</span>
        <span><i style="background:#0071e3"></i>分组</span>
        <span><i style="background:#bb9af7"></i>MCP</span>
        <span><i style="background:#9ece6a"></i>投影连线</span>
      </div>
    </div>
  </section>
  <section id="tab-mc" hidden></section>
  <section id="tab-bk" hidden></section>
  <section id="tab-mt" hidden></section>
  <section id="tab-lg" hidden></section>
</main>

<div id="mask"></div>
<div id="drawer">
  <div class="dhead"><h2 id="dTitle"></h2><button id="closeDrawer">关闭</button></div>
  <div class="dbody" id="dBody"></div>
</div>

<script>
const AGENT_COLORS={pi:"#5e5ce6",codex:"#34c759",opencode:"#ff9f0a",workbuddy:"#64d2ff",claude:"#bf5af2",grok:"#64d2ff",hermes:"#30d158"};
const STATE_LABEL={linked:"已投影",trial:"试用 UL",conflict:"冲突",not_linked:"未投影",broken:"断链",copy_broken:"copy 断链",copy_drift:"copy 漂移",store_drift:"中央库漂移"};
let DATA=null, TAB="ov", SORT={key:null,dir:1}, MODEL_SUGGESTIONS=[];
let DIST_SELECTION_DIRTY=false, DIST_SELECTION_CONFLICT=false;
let SK_VIEW="list";
const GRAPH={selected:null, hover:null, view:{x:0,y:0,k:1}, nodes:[], edges:[], nmap:{}, adj:{}, bound:false, alpha:0, raf:null, nodeScale:0.4, glow:0.55, nodeAlpha:0.85};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtSize=n=>n<0?"":n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
const color=a=>AGENT_COLORS[a]||"#94a3b8";

async function load(){
  try{
    const r=await fetch("/api/data",{credentials:"same-origin"});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));
    const prevSources=DATA&&DATA.sources, prevModels=DATA&&DATA.models;
    DATA=d;
    if(prevSources)DATA.sources=prevSources;
    if(prevModels)DATA.models=prevModels;
    const hash=location.hash;
    if(location.search.includes("token=")) history.replaceState({},"",location.pathname+hash);
    renderChips(); renderOverview(); renderSkills(); renderMcp(); renderBackups();
    if(TAB==="mt")renderMaintenance();
    if(TAB==="lg")renderLogs();
    if(hash==="#graph"){
      TAB="sk";
      document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x.dataset.t==="sk"));
      ["ov","sk","mc","bk","mt","lg"].forEach(t=>document.getElementById("tab-"+t).hidden=(t!=="sk"));
      setSkillView("graph");
    }else if(TAB==="sk"&&SK_VIEW==="graph") renderGraph(true);
  }catch(err){
    document.getElementById("tab-ov").innerHTML=`<p class="empty">加载失败: ${esc(err.message)}。请使用终端打印的带 token 的 URL 打开。</p>`;
  }
}

/* ---------- header ---------- */
function renderChips(){
  const s=DATA.summary;
  document.getElementById("chips").innerHTML=
    `<span class="chip">skills <b>${s.skills}</b></span>`+
    `<span class="chip">风险 <b style="color:${s.risky?"#ff453a":"inherit"}">${s.risky}</b></span>`+
    `<span class="chip">agents <b>${s.agents}</b></span>`+
    `<span class="chip">投影 <b>${s.linked_total}</b></span>`+
    `<span class="chip">MCP <b>${s.mcp_servers}</b></span>`+
    `<span class="chip">备份 <b>${s.backups}</b></span>`+
    (DATA.read_only?`<span class="chip"><b style="color:var(--amber)">只读</b></span>`:"");
  document.getElementById("genat").textContent="生成于 "+DATA.generated_at;
  const p=DATA.paths;
  document.getElementById("paths").innerHTML=
    `store <span class="mono">${esc(p.store)}</span> · index <span class="mono">${esc(p.index)}</span>`;
}

/* ---------- 概览 ---------- */
function renderOverview(){

/* ---------- skills ---------- */
function renderSkills(){
  const sel=document.getElementById("fAgent");
  const cur=sel.value;
  sel.innerHTML=`<option value="">全部 agent 投影状态</option>`+
    DATA.agents.map(a=>`<option value="${a.name}">${a.name}</option>`).join("");
  sel.value=cur;
  ["q","fAgent","fState","fRisk"].forEach(id=>{
    const e=document.getElementById(id);
    if(!e._bound){e.addEventListener("input",renderSkillTable);e._bound=1}
  });
  renderSkillTable();
}
function renderSkillTable(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const fa=document.getElementById("fAgent").value, fs=document.getElementById("fState").value;
  const fr=document.getElementById("fRisk").checked;
  let rows=DATA.skills.filter(s=>{
    if(fr&&!s.risks.length)return false;
    if(fs){ if(fa){ if(s.states[fa]!==fs)return false } else if(!Object.values(s.states).includes(fs))return false }
    if(fa&&!fs&&s.states[fa]===undefined)return false;
    if(q&&!((s.name+" "+s.desc+" "+s.id+" "+s.category).toLowerCase().includes(q)))return false;
    return true;
  });
  if(SORT.key){
    const k=SORT.key, d=SORT.dir;
    rows=[...rows].sort((a,b)=>{
      let va,vb;
      if(k==="risks"){va=a.risks.length;vb=b.risks.length}
      else if(k==="size"){va=a.size||0;vb=b.size||0}
      else{va=(a[k]||"").toLowerCase();vb=(b[k]||"").toLowerCase();return va<vb?-d:va>vb?d:0}
      return (va-vb)*d;
    });
  }
  const caret=k=>SORT.key===k?(SORT.dir>0?" ▲":" ▼"):"";
  document.getElementById("skCount").textContent=`${rows.length} / ${DATA.skills.length} 个 skill`;
  document.getElementById("skTable").innerHTML=
   `<table><thead><tr>
      <th data-sort="name" style="cursor:pointer">名称${caret("name")}</th>
      <th data-sort="category" style="cursor:pointer">分类${caret("category")}</th>
      <th>描述</th>
      <th data-sort="risks" style="cursor:pointer">风险${caret("risks")}</th>
      <th data-sort="size" style="cursor:pointer">大小${caret("size")}</th>
      <th>来源 agent</th><th>投影状态</th></tr></thead><tbody>`+
   rows.map(s=>`<tr data-sid="${esc(s.id)}">
     <td class="mono">${esc(s.name)}</td>
     <td style="color:var(--dim)">${esc(s.category)||"—"}</td>
     <td class="desc" title="${esc(s.desc)}">${esc(s.desc)||"—"}</td>
     <td>${s.risks.length?s.risks.map(r=>`<span class="risk">${esc(r)}</span>`).join(""):`<span class="risk none">无</span>`}</td>
     <td class="mono">${fmtSize(s.size||0)}</td>
     <td>${s.source_agents.map(a=>`<span style="color:${color(a)};font-size:12px">${esc(a)}</span>`).join(" ")}</td>
     <td>${DATA.agents.map(a=>{const st=s.states[a.name];
        return st?`<span class="sdot s-${st}" title="${a.name}: ${STATE_LABEL[st]||st}"></span>`:""}).join("")}</td>
   </tr>`).join("")+`</tbody></table>`;
}
function setSort(k){
  if(SORT.key===k)SORT.dir*=-1; else SORT={key:k,dir:1};
  renderSkillTable();
}

/* ---------- skill 详情抽屉 ---------- */
async function openSkill(sid){
  document.getElementById("mask").classList.add("show");
  const dr=document.getElementById("drawer"); dr.classList.add("open");
  document.getElementById("dTitle").textContent=sid;
  const body=document.getElementById("dBody");
  body.innerHTML=`<p class="empty">加载中…</p>`;
  try{
    const r=await fetch("/api/skill/"+encodeURIComponent(sid));
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));
    renderSkillDrawer(sid,d);
  }catch(err){body.innerHTML=`<p class="empty">加载失败: ${esc(err.message)}</p>`}
}

function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("mask").classList.remove("show");
}
async function postPreviewThenApply(url,payload,label,phrase){
  if(DATA&&DATA.read_only){alert("GUI 处于只读模式，写操作已禁用");return null}
  const preview=await fetch(url,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,apply:false})});
  const pd=await preview.json();
  if(!preview.ok||pd.error)throw new Error(pd.error||"预览失败");
  const plan=JSON.stringify(pd,null,2);
  if(!confirm(`${label}\n\n${plan.length>12000?plan.slice(0,12000)+"\n…":plan}\n\n确认执行？`))return null;
  const body={...payload,apply:true,confirm:true};
  if(phrase){
    const typed=prompt(`这是高风险写操作。请输入 ${phrase} 确认：`);
    if(typed!==phrase){alert("确认短语不匹配，已取消");return null}
    body.confirm_phrase=phrase;
  }
  const applied=await fetch(url,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const ad=await applied.json();
  if(!applied.ok||ad.error)throw new Error(ad.error||"执行失败");
  return ad;
}
async function loadDiagnosis(sid){
  const el=document.getElementById("diag-"+sid); if(!el)return;
  try{
    const r=await fetch("/api/skill/"+encodeURIComponent(sid)+"/diagnose"); const d=await r.json();
    const missing=d.missing||[], manual=d.needs_manual||[];
    const items=[...missing,...manual];
    const blocked=items.length?`<span class="danger">发布阻断：${items.map(x=>esc((x.kind||"")+":"+(x.name||""))+" "+esc(x.status)).join("、")}</span>`:`<span class="success">未发现静态缺项</span>`;
    const missingHtml=missing.length?`<div class="note">缺失项不能在 GUI 中伪造为已满足，请先补齐后重新诊断。</div>`:"";
    const manualHtml=manual.length?`<div class="note">选择本次确实核验过的待验证项（可部分确认）：</div>
      <div class="diag-list">${manual.map(x=>{const key=(x.kind||"")+":"+(x.name||"");return `<label class="ck"><input type="checkbox" data-diag-sid="${esc(sid)}" data-diag-key="${esc(key)}">${esc(key)} <span class="note">${esc(x.source||x.certainty||x.status||"")}</span></label>`}).join("")}</div>
      <div class="formrow"><input id="diag-note-${esc(sid)}" placeholder="本次核验备注（可选）" style="min-width:260px"><button class="smallbtn" data-diag-confirm-sid="${esc(sid)}">确认选中项</button></div>`:"";
    el.innerHTML=blocked+missingHtml+manualHtml;
  }catch(err){el.textContent="诊断失败: "+err.message}
}

  try{
    const r=await fetch("/api/skill/"+encodeURIComponent(sid)+"/file?path="+encodeURIComponent(path)); const d=await r.json();

/* ---------- 写操作: 投影 / 解除 ---------- */
async function proj(sid, agent, state){
  if(DATA&&DATA.read_only){alert("GUI 处于只读模式，写操作已禁用");return}
  const isOurs=["linked","broken","copy_broken"].includes(state);
  const act=isOurs?"unlink":"link";
  let force=false;
  if(act==="link" && ["broken","copy_broken"].includes(state)){
    alert("中央库副本已缺失 (悬空链接), 请先 import 或用 CLI rollback 修复中央库。");
    return;
  }
  if(state==="store_drift"){
    alert("中央库副本与索引摘要不一致，请先恢复或重新导入中央库。");
    return;
  }
  if(act==="link" && (state==="conflict"||state==="copy_drift")) force=true;
  try{
    const ad=await postPreviewThenApply("/api/"+act,{sid,agents:[agent],force},
      act==="unlink"?`解除 ${agent} 上的投影（只移除投影，不动中央库）`:
      force?`投影到 ${agent}（将备份后替换已有非本库内容）`:`投影到 ${agent}`);
    if(!ad)return;
    const acts=(ad.actions&&ad.actions[agent])||[];
    const bad=acts.filter(a=>["error","conflict","copy_drift","store_drift","blocked","broken"].includes(a.type));
    if(bad.length)alert("未完成: "+bad.map(a=>a.detail).join("; "));
    await load();
    openSkill(sid);
  }catch(err){alert("失败: "+err.message)}
}

/* ---------- CSV 导出 ---------- */
function exportCsv(){
  const agents=DATA.agents.map(a=>a.name);
  const head=["id","name","category","risks","source_agents",...agents.map(a=>a+"_state")];
  const lines=[head.join(",")];
  DATA.skills.forEach(s=>{
    const row=[s.id,s.name,s.category,s.risks.join("|"),s.source_agents.join("|"),
               ...agents.map(a=>s.states[a]||"")];
    lines.push(row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="skillhub-skills.csv";
  a.click();
}

function savedDistributionSource(agent){
  const raw=(DATA.distribution_sources||{})[agent]||{};
  return {groups:Array.isArray(raw.groups)?raw.groups:[],sids:Array.isArray(raw.sids)?raw.sids:[],replace:!!raw.replace};
}
function distributionSourceKey(source){return JSON.stringify({groups:[...(source.groups||[])].sort(),sids:[...(source.sids||[])].sort(),replace:!!source.replace})}
function syncDistributionSelection(){
  const agents=[...document.querySelectorAll("[data-dist-agent]:checked")].map(x=>x.dataset.distAgent);
  const sources=agents.map(savedDistributionSource);
  DIST_SELECTION_CONFLICT=sources.length>1&&sources.some(source=>distributionSourceKey(source)!==distributionSourceKey(sources[0]));
  if(agents.length===1 || (agents.length>1&&!DIST_SELECTION_CONFLICT)){
    const source=sources[0]||{groups:[],sids:[],replace:false};
    document.querySelectorAll("[data-dist-group]").forEach(x=>{x.checked=source.groups.includes(x.dataset.distGroup)});
    document.querySelectorAll("[data-dist-sid]").forEach(x=>{x.checked=source.sids.includes(x.dataset.distSid)});
    const replace=document.getElementById("distReplace"); if(replace)replace.checked=source.replace;
    DIST_SELECTION_DIRTY=false;
  }else if(DIST_SELECTION_CONFLICT){
    document.querySelectorAll("[data-dist-group],[data-dist-sid]").forEach(x=>{x.checked=false});
    const replace=document.getElementById("distReplace"); if(replace)replace.checked=false;
    DIST_SELECTION_DIRTY=false;
  }else if(!agents.length){
    document.querySelectorAll("[data-dist-group],[data-dist-sid]").forEach(x=>{x.checked=false});
    const replace=document.getElementById("distReplace"); if(replace)replace.checked=false;
    DIST_SELECTION_DIRTY=false;
  }
  updateDistributionSummary();
}
function updateDistributionSummary(){
  const groupNames=[...document.querySelectorAll("[data-dist-group]:checked")].map(x=>{const g=DATA.groups[x.dataset.distGroup]||{};return g.name||x.dataset.distGroup});
  const skillNames=[...document.querySelectorAll("[data-dist-sid]:checked")].map(x=>(DATA.skills.find(s=>s.id===x.dataset.distSid)||{}).name||x.dataset.distSid);
  const agents=[...document.querySelectorAll("[data-dist-agent]:checked")].map(x=>x.dataset.distAgent);
  const groupEl=document.getElementById("distGroupSelected"),skillEl=document.getElementById("distSkillSelected"),savedEl=document.getElementById("distSaved"),projectionEl=document.getElementById("distProjection");
  if(groupEl)groupEl.textContent="当前选择分组："+(groupNames.join("、")||"无");
  if(skillEl)skillEl.textContent="当前选择 skill："+(skillNames.join("、")||"无");
  if(savedEl){
    if(!agents.length)savedEl.textContent="选择 agent 后显示已保存来源选择。";
    else if(DIST_SELECTION_CONFLICT)savedEl.textContent="已选 agent 的保存来源不同；当前未自动合并，请手动选出共同来源后再预览。";

/* ---------- 中央库关系图（Obsidian 式） ---------- */
const EDGE_COLOR={member:"#3d59a1",dist:"#7aa2f7",mcp:"#bb9af7",version:"#e0af68",
  linked:"#9ece6a",trial:"#7dcfff",conflict:"#e0af68",broken:"#f7768e",
  copy_broken:"#f7768e",copy_drift:"#ff9e64",store_drift:"#e0af68",source:"#565f89"};
const EDGE_LABEL={member:"分组成员",dist:"分发来源",mcp:"MCP 目标",version:"formal ↔ ul",
  linked:"已投影",trial:"试用 UL",conflict:"冲突",broken:"断链",copy_broken:"copy 断链",
  copy_drift:"copy 漂移",store_drift:"已投影（中央库漂移）",source:"导入来源"};
const MAPPED={linked:1,copy:1,trial:1,conflict:1,broken:1,copy_broken:1,copy_drift:1,store_drift:1};
const CAT_PALETTE=["#7aa2f7","#9ece6a","#bb9af7","#7dcfff","#e0af68","#f7768e","#73daca","#ff9e64","#2ac3de","#c0caf5","#9d7cd8","#e0de71"];
function catColor(name){
  let h=2166136261;
  for(const ch of String(name||"")) h=Math.imul(h^ch.charCodeAt(0),16777619);
  return CAT_PALETTE[(h>>>0)%CAT_PALETTE.length];
}

}

function hexRgba(hex, a){
  const h=String(hex||"#c0caf5").replace("#","");
  const n=h.length===3?h.split("").map(c=>c+c).join(""):h.padEnd(6,"0");
  const r=parseInt(n.slice(0,2),16)||192, g=parseInt(n.slice(2,4),16)||202, b=parseInt(n.slice(4,6),16)||245;
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, a))})`;
}

function graphFilters(){
  return {
    q:(document.getElementById("graphQ").value||"").trim().toLowerCase(),
    orphans:document.getElementById("graphOrphans").checked,
    groups:document.getElementById("graphGroups").checked,
    version:document.getElementById("graphVersion").checked,
    mcp:document.getElementById("graphMcp").checked,
    local:document.getElementById("graphLocal").checked
  };
}

function buildGraphModel(){
  const f=graphFilters();
  const nodes=[], edges=[], map={};
  const scale=GRAPH.nodeScale||0.4;
  const add=n=>{
    n.baseR=n.baseR||n.r; n.r=n.baseR*scale;
    if(!map[n.id]){ map[n.id]=n; nodes.push(n);} return map[n.id];
  };
  const link=(a,b,kind)=>{
    if(!map[a]||!map[b]||a===b) return;
    edges.push({source:a,target:b,kind});
  };
  (DATA.agents||[]).forEach(a=>add({
    id:"a:"+a.name, type:"agent", label:a.name, color:color(a.name),
    baseR:16, r:16, charge:280, detail:`${a.mode}${a.nested?" · nested":""}`
  }));
  if(f.mcp) (DATA.mcp_servers||[]).forEach(s=>{
    add({id:"m:"+s.id, type:"mcp", label:s.label||s.id, color:"#bb9af7", baseR:11, r:11, charge:140,
      detail:(s.transport||"")+" · "+((s.agents||[]).join(", ")||"无目标")});
    (s.agents||[]).forEach(ag=>link("m:"+s.id,"a:"+ag,"mcp"));
  });
  const inGroup={};
  if(f.groups) Object.entries(DATA.groups||{}).forEach(([gid,g])=>{
    const members=g.members||[];
    add({id:"g:"+gid, type:"group", label:g.name||gid, color:"#7aa2f7", baseR:12, r:12, charge:160,
      count:members.length, detail:members.length+" 个成员"});
    members.forEach(sid=>{ (inGroup[sid]=inGroup[sid]||[]).push(gid); });
  });
  const mappedSids=new Set();
  (DATA.skills||[]).forEach(s=>{
    const mapped=Object.entries(s.states||{}).filter(([,st])=>MAPPED[st]);
    if(mapped.length) mappedSids.add(s.id);
  });
  (DATA.skills||[]).forEach(s=>{
    const qhit=!f.q||(s.name+" "+s.id+" "+(s.desc||"")+" "+(s.category||"")).toLowerCase().includes(f.q);
    if(!qhit) return;
    const mapped=Object.entries(s.states||{}).filter(([,st])=>MAPPED[st]);
    if(!f.orphans && !mapped.length && !(f.groups&&inGroup[s.id])) return;
    add({id:"s:"+s.id, type:"skill", sid:s.id, label:s.name, category:s.category||"未分类",
      color: (s.risks&&s.risks.length)?"#f7768e":catColor(s.category||s.name),
      baseR: mapped.length? 6+Math.min(4,mapped.length):5, r:5, charge:90, risky:!!(s.risks&&s.risks.length),
      channel:s.channel||"formal",
      detail:(s.channel||"formal")+" · "+(mapped.length?mapped.map(([ag,st])=>ag+"="+st).join("、"):"未投影")
        +((s.risks||[]).length?" · "+s.risks.join(","):"")});
    mapped.forEach(([ag,st])=>link("s:"+s.id,"a:"+ag,st==="copy"?"linked":st));
    if(f.groups&&inGroup[s.id]) inGroup[s.id].forEach(gid=>link("g:"+gid,"s:"+s.id,"member"));
  });
  if(f.version) (DATA.skills||[]).forEach(s=>{
    if(s.channel==="formal"&&s.ul_sid&&map["s:"+s.id]&&map["s:"+s.ul_sid])
      link("s:"+s.id,"s:"+s.ul_sid,"version");
  });
  if(f.groups) Object.entries(DATA.distribution_sources||{}).forEach(([ag,src])=>{
    (src.groups||[]).forEach(gid=>link("g:"+gid,"a:"+ag,"dist"));
    (src.sids||[]).forEach(sid=>link("s:"+sid,"a:"+ag,"dist"));
  });
  if(f.local&&GRAPH.selected){
    const keep=new Set([GRAPH.selected]);
    edges.forEach(e=>{ if(e.source===GRAPH.selected) keep.add(e.target); if(e.target===GRAPH.selected) keep.add(e.source); });
    return {nodes:nodes.filter(n=>keep.has(n.id)), edges:edges.filter(e=>keep.has(e.source)&&keep.has(e.target))};
  }
  return {nodes,edges};
}

function placeGraphNodes(nodes,W,H,prev){
  const cx=W/2, cy=H/2;
  const agents=nodes.filter(n=>n.type==="agent");
  const skills=nodes.filter(n=>n.type==="skill");
  const others=nodes.filter(n=>n.type!=="agent"&&n.type!=="skill");
  agents.forEach((n,i)=>{
    if(prev[n.id]){ n.x=prev[n.id].x; n.y=prev[n.id].y; n.pin=prev[n.id].pin; return; }
    const a=-Math.PI/2+2*Math.PI*i/Math.max(agents.length,1);
    n.x=cx+Math.cos(a)*Math.min(W,H)*0.34;
    n.y=cy+Math.sin(a)*Math.min(W,H)*0.34;
  });
  skills.forEach((n,i)=>{
    if(prev[n.id]){ n.x=prev[n.id].x; n.y=prev[n.id].y; n.pin=prev[n.id].pin; return; }
    const a=2*Math.PI*(i+0.13)/Math.max(skills.length,1);
    const rad=Math.min(W,H)*(0.08+0.22*(i%7)/7);
    n.x=cx+Math.cos(a)*rad+(Math.random()-0.5)*8;
    n.y=cy+Math.sin(a)*rad+(Math.random()-0.5)*8;
  });
  others.forEach((n,i,arr)=>{
    if(prev[n.id]){ n.x=prev[n.id].x; n.y=prev[n.id].y; n.pin=prev[n.id].pin; return; }
    const a=2*Math.PI*i/Math.max(arr.length,1);
    n.x=cx+Math.cos(a)*Math.min(W,H)*0.18;
    n.y=cy+Math.sin(a)*Math.min(W,H)*0.18;
  });
}

function graphStep(W,H){
  const nodes=GRAPH.nodes, edges=GRAPH.edges;
  const n=nodes.length; if(!n) return;
  const alpha=GRAPH.alpha;
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const a=nodes[i], b=nodes[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy||0.01;
      const dist=Math.sqrt(d2);
      const minD=a.r+b.r+8;
      let f=((a.charge+b.charge)/2)/d2;
      if(dist<minD) f+= (minD-dist)*0.08;
      dx=dx/dist*f*alpha; dy=dy/dist*f*alpha;
      if(!a.pin){ a.x-=dx; a.y-=dy; }
      if(!b.pin){ b.x+=dx; b.y+=dy; }
    }
  }
  const idx=GRAPH.idx;
  for(const e of edges){
    const a=nodes[idx[e.source]], b=nodes[idx[e.target]]; if(!a||!b) continue;
    let dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy)||1;
    const rest=e.kind==="version"?42:e.kind==="member"?56:e.kind==="mcp"?70:108;
    const f=(dist-rest)*0.035*alpha, fx=dx/dist*f, fy=dy/dist*f;
    if(!a.pin){ a.x+=fx; a.y+=fy; }
    if(!b.pin){ b.x-=fx; b.y-=fy; }
  }
  for(const n of nodes){
    if(n.pin) continue;
    n.x+=(W/2-n.x)*0.015*alpha;
    n.y+=(H/2-n.y)*0.015*alpha;
  }
}

function graphSize(){
  const canvas=document.getElementById("graphCanvas");
  const wrap=canvas.parentElement;
  const cssW=Math.max(320, wrap.clientWidth||900);
  const cssH=Math.max(320, canvas.clientHeight||640);
  const dpr=window.devicePixelRatio||1;
  if(canvas.width!==Math.floor(cssW*dpr)||canvas.height!==Math.floor(cssH*dpr)){
    canvas.width=Math.floor(cssW*dpr); canvas.height=Math.floor(cssH*dpr);
    canvas.style.width=cssW+"px"; canvas.style.height=cssH+"px";
  }
  return {W:cssW, H:cssH, dpr};
}

function neighborSet(id){
  const s=new Set([id]);
  (GRAPH.edges||[]).forEach(e=>{ if(e.source===id) s.add(e.target); if(e.target===id) s.add(e.source); });
  return s;
}

function drawGraph(){
  const canvas=document.getElementById("graphCanvas"); if(!canvas) return;
  const {W,H,dpr}=graphSize();
  const ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#1e1e1e"; ctx.fillRect(0,0,W,H);
  const {x:vx,y:vy,k}=GRAPH.view;
  ctx.save();
  ctx.translate(vx,vy); ctx.scale(k,k);
  const focus=GRAPH.selected||GRAPH.hover;
  const neigh=focus?neighborSet(focus):null;
  const dim=!!focus;
  GRAPH.edges.forEach(e=>{
    const a=GRAPH.nmap[e.source], b=GRAPH.nmap[e.target]; if(!a||!b) return;
    const hot=neigh&&(neigh.has(e.source)&&neigh.has(e.target));
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=EDGE_COLOR[e.kind]||"#444";
    ctx.globalAlpha=dim?(hot?0.9:0.06):0.42;
    ctx.lineWidth=(hot?2.2:1.15)/k;
    if(e.kind==="version"||e.kind==="dist"||e.kind==="source") ctx.setLineDash([5/k,4/k]);
    else ctx.setLineDash([]);
    ctx.stroke();
  });
  ctx.setLineDash([]);
  const glow=GRAPH.glow??0.55;
  const fillA=GRAPH.nodeAlpha??0.85;
  GRAPH.nodes.forEach(n=>{
    const hot=!dim||neigh.has(n.id);
    const dimA=hot?1:0.12;
    const col=n.color||"#c0caf5";
    const selected=GRAPH.selected===n.id;
    const glowBoost=selected||GRAPH.hover===n.id?1.25:1;
    if(glow>0.01&&hot){
      const halo=n.r*(1.6+glow*2.8*glowBoost);
      const grad=ctx.createRadialGradient(n.x,n.y,Math.max(0.2,n.r*0.15), n.x,n.y,halo);
      grad.addColorStop(0, hexRgba(col, 0.65*glow*fillA*dimA));
      grad.addColorStop(0.35, hexRgba(col, 0.28*glow*fillA*dimA));
      grad.addColorStop(1, hexRgba(col, 0));
      ctx.globalAlpha=1;
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(n.x,n.y,halo,0,Math.PI*2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=col;
    ctx.globalAlpha=fillA*dimA;
    if(glow>0.01&&hot){
      ctx.shadowColor=hexRgba(col, 0.95*glow);
      ctx.shadowBlur=Math.max(2, n.r*(2.2+glow*6)*glowBoost);
    }else{
      ctx.shadowColor="transparent"; ctx.shadowBlur=0;
    }
    ctx.fill();
    ctx.shadowColor="transparent"; ctx.shadowBlur=0;
    if(selected){
      ctx.strokeStyle="#fff"; ctx.lineWidth=2/k; ctx.globalAlpha=Math.max(0.35, fillA); ctx.stroke();
    }
    const showLabel=n.type==="agent"||n.type==="group"||n.type==="mcp"||selected||GRAPH.hover===n.id;
    if(showLabel&&hot){
      ctx.font="12px -apple-system,'PingFang SC',sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="top";
      ctx.globalAlpha=0.92;
      ctx.fillStyle="#e6e6e6";
      ctx.fillText((n.label||"").slice(0,22), n.x, n.y+n.r+4);
    }
  });
  ctx.restore();
}

function graphInfo(id){
  const el=document.getElementById("graphInfo");
  const n=GRAPH.nmap[id];
  if(!n){
    el.innerHTML=`<p class="k">每个 skill 是一个点。<br>已投影到 agent 的会连线。<br>悬停看名称 · 单击高亮邻居 · 双击打开详情</p>`;
    return;
  }
  const neigh=GRAPH.edges.filter(e=>e.source===id||e.target===id).map(e=>{
    const other=e.source===id?e.target:e.source;
    const on=GRAPH.nmap[other];
    return {kind:e.kind,label:(on&&on.label)||other,id:other,type:on&&on.type};
  });
  const typeLabel={agent:"Agent",group:"分组",skill:"Skill",mcp:"MCP"}[n.type]||n.type;
  const actions=[];
  if(n.type==="skill"&&n.sid) actions.push(`<button class="smallbtn" data-graph-open="${esc(n.sid)}">打开详情</button>`);
  el.innerHTML=`<div class="k">${esc(typeLabel)}</div><h3>${esc(n.label)}</h3>
    <p>${esc(n.detail||"")}</p>
    <div class="formrow">${actions.join("")}</div>
    <div class="k" style="margin-top:12px">连接 ${neigh.length}</div>
    <ul class="nb">${neigh.slice(0,60).map(x=>`<li><span style="color:${EDGE_COLOR[x.kind]||"#aaa"}">${esc(EDGE_LABEL[x.kind]||x.kind)}</span> · ${esc(x.label)}</li>`).join("")||"<li>无连线</li>"}</ul>`;
}

function fitCanvas(){
  const {W,H}=graphSize();
  const nodes=GRAPH.nodes; if(!nodes.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(n=>{
    minX=Math.min(minX,n.x-n.r-6); minY=Math.min(minY,n.y-n.r-18);
    maxX=Math.max(maxX,n.x+n.r+6); maxY=Math.max(maxY,n.y+n.r+18);
  });
  const bw=Math.max(40,maxX-minX), bh=Math.max(40,maxY-minY);
  const k=Math.min((W-72)/bw,(H-72)/bh,1.6);
  GRAPH.view.k=k;
  GRAPH.view.x=W/2-k*(minX+maxX)/2;
  GRAPH.view.y=H/2-k*(minY+maxY)/2;
}
function graphWake(){
  GRAPH.alpha=Math.max(GRAPH.alpha,0.7);
  if(!GRAPH.raf) GRAPH.raf=requestAnimationFrame(graphTick);
}
function graphTick(){
  const {W,H}=graphSize();
  for(let i=0;i<4;i++) graphStep(W,H);
  GRAPH.alpha*=0.93;
  drawGraph();
  if(GRAPH.alpha>0.025) GRAPH.raf=requestAnimationFrame(graphTick);
  else {
    GRAPH.raf=null;
    if(GRAPH.needFit){ fitCanvas(); GRAPH.needFit=false; drawGraph(); }
  }
}

function renderGraph(relayout){
  if(!DATA||document.getElementById("skGraph").hidden) return;
  applyNodeScale();
  const {W,H}=graphSize();
  const prev=Object.fromEntries((GRAPH.nodes||[]).map(n=>[n.id,{x:n.x,y:n.y,pin:n.pin}]));
  const model=buildGraphModel();
  placeGraphNodes(model.nodes,W,H, relayout?{}:prev);
  if(!relayout) model.nodes.forEach(n=>{ const p=prev[n.id]; if(p){ n.x=p.x; n.y=p.y; n.pin=p.pin; }});
  GRAPH.nodes=model.nodes; GRAPH.edges=model.edges;
  GRAPH.nmap=Object.fromEntries(model.nodes.map(n=>[n.id,n]));
  GRAPH.idx=Object.fromEntries(model.nodes.map((n,i)=>[n.id,i]));
  const mapped=model.edges.filter(e=>MAPPED[e.kind]||e.kind==="linked").length;
  const stat=document.getElementById("graphStat");
  if(stat) stat.textContent=`${model.nodes.length} 个节点 · ${model.edges.length} 条边 · ${mapped} 条投影`;
  graphInfo(GRAPH.selected);
  bindGraphEvents();
  if(relayout){ GRAPH.view={x:0,y:0,k:1}; }
  const size=graphSize();
  GRAPH.alpha=1;
  for(let i=0;i<50;i++) graphStep(size.W,size.H);
  GRAPH.alpha=0.45;
  if(relayout) fitCanvas();
  drawGraph();
  graphWake();
}

function hitNode(px,py){
  const {x:vx,y:vy,k}=GRAPH.view;
  const wx=(px-vx)/k, wy=(py-vy)/k;
  for(let i=GRAPH.nodes.length-1;i>=0;i--){
    const n=GRAPH.nodes[i];
    const extra=n.type==="agent"?6:3;
    if((n.x-wx)**2+(n.y-wy)**2 <= (n.r+extra)**2) return n.id;
  }
  return null;
}

function bindGraphEvents(){
  if(GRAPH.bound) return;
  GRAPH.bound=true;
  const canvas=document.getElementById("graphCanvas");
  const hint=document.getElementById("graphHint");
  let mode=null, last={x:0,y:0}, drag=null;
  canvas.addEventListener("wheel",e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const wx=(mx-GRAPH.view.x)/GRAPH.view.k, wy=(my-GRAPH.view.y)/GRAPH.view.k;
    const nk=Math.max(0.2, Math.min(5, GRAPH.view.k*(e.deltaY<0?1.12:0.89)));
    GRAPH.view.k=nk; GRAPH.view.x=mx-wx*nk; GRAPH.view.y=my-wy*nk;
    drawGraph();
  },{passive:false});
  canvas.addEventListener("pointerdown",e=>{
    const rect=canvas.getBoundingClientRect();
    const id=hitNode(e.clientX-rect.left, e.clientY-rect.top);
    last={x:e.clientX,y:e.clientY};
    if(id){ mode="node"; drag=id; GRAPH.selected=id; graphInfo(id); drawGraph(); canvas.classList.add("dragging"); }
    else { mode="pan"; GRAPH.selected=null; graphInfo(null); drawGraph(); canvas.classList.add("dragging"); }
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    const rect=canvas.getBoundingClientRect();
    const dx=e.clientX-last.x, dy=e.clientY-last.y;
    if(!mode){
      const id=hitNode(e.clientX-rect.left, e.clientY-rect.top);
      if(id!==GRAPH.hover){
        GRAPH.hover=id; drawGraph();
        if(id&&GRAPH.nmap[id]){
          hint.hidden=false; hint.textContent=GRAPH.nmap[id].label;
          hint.style.left=(e.clientX-rect.left)+"px"; hint.style.top=(e.clientY-rect.top)+"px";
        }else hint.hidden=true;
      }else if(id){
        hint.style.left=(e.clientX-rect.left)+"px"; hint.style.top=(e.clientY-rect.top)+"px";
      }
      return;
    }
    last={x:e.clientX,y:e.clientY};
    if(mode==="pan"){ GRAPH.view.x+=dx; GRAPH.view.y+=dy; drawGraph(); }
    else if(mode==="node"&&drag&&GRAPH.nmap[drag]){
      const n=GRAPH.nmap[drag]; n.pin=true;
      n.x+=dx/GRAPH.view.k; n.y+=dy/GRAPH.view.k;
      graphWake();
    }
  });
  canvas.addEventListener("pointerup",()=>{ mode=null; drag=null; canvas.classList.remove("dragging"); });
  canvas.addEventListener("pointerleave",()=>{ if(!mode){ GRAPH.hover=null; hint.hidden=true; drawGraph(); }});
  canvas.addEventListener("dblclick",e=>{
    const rect=canvas.getBoundingClientRect();
    const id=hitNode(e.clientX-rect.left, e.clientY-rect.top);
    const n=id&&GRAPH.nmap[id];
    if(n&&n.type==="skill"&&n.sid) openSkill(n.sid);
  });
  document.getElementById("graphInfo").addEventListener("click",e=>{
    const open=e.target.closest("[data-graph-open]");
    if(open) openSkill(open.dataset.graphOpen);
  });
  ["graphQ","graphOrphans","graphGroups","graphVersion","graphMcp","graphLocal"].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener(id==="graphQ"?"input":"change",()=>renderGraph(false));
  });
  ["graphSize","graphGlow","graphAlpha"].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener("input",()=>{ applyGraphStyle(); drawGraph(); });
  });
  document.getElementById("graphReset").addEventListener("click",()=>{
    GRAPH.view={x:0,y:0,k:1}; GRAPH.selected=null; GRAPH.hover=null;
    document.getElementById("graphLocal").checked=false;
    const size=document.getElementById("graphSize");
    const glow=document.getElementById("graphGlow");
    const alpha=document.getElementById("graphAlpha");
    if(size) size.value="40";
    if(glow) glow.value="55";
    if(alpha) alpha.value="85";
    GRAPH.nodes=[];
    renderGraph(true);
  });
  window.addEventListener("resize",()=>{ if(!document.getElementById("skGraph").hidden) drawGraph(); });
}

/* ---------- tabs ---------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  TAB=b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));
  ["ov","sk","mc","bk","mt","lg"].forEach(t=>document.getElementById("tab-"+t).hidden=(t!==TAB));
  if(TAB==="sk"){ renderSkillTable(); if(SK_VIEW==="graph") renderGraph(true); }
  if(TAB==="mt")renderMaintenance();
  if(TAB==="lg")renderLogs();
});

load();
</script>
