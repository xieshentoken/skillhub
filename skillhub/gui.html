<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skillhub</title>
<script>
  // 尽早应用主题，避免闪烁：auto 跟随系统，light/dark 为手动选择。
  (function(){var t=localStorage.getItem("skillhub.theme")||"auto";
    var dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme=dark?"dark":"light";})();
</script>
<link rel="stylesheet" href="/static/gui.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">skill<span>hub</span></div>
    <nav id="tabs" aria-label="主导航">
      <a href="#/ov" data-t="ov">概览</a>
      <a href="#/sk" data-t="sk">Skills</a>
      <a href="#/im" data-t="im">导入</a>
      <a href="#/gr" data-t="gr">分组与分发</a>
      <a href="#/mc" data-t="mc">MCP</a>
      <a href="#/bk" data-t="bk">备份与回收</a>
      <a href="#/md" data-t="md">模型</a>
      <a href="#/lg" data-t="lg">日志与设置</a>
    </nav>
    <div class="top-actions">
      <label class="ck" title="每 15 秒刷新（页面不可见时暂停）"><input type="checkbox" id="autoRefresh"> 自动刷新</label>
      <button id="themeToggle" title="切换主题"></button>
      <button id="refresh" class="primary">刷新</button>
    </div>
  </div>
</header>
<div class="statusbar" id="statusbar"></div>
<main>
  <section id="tab-ov" data-tab="ov"></section>
  <section id="tab-sk" data-tab="sk" hidden>
    <div class="section-head">
      <h2>中央库</h2>
      <div class="view-switch" id="skViewSwitch">
        <button type="button" data-sk-view="list" class="active">列表</button>
        <button type="button" data-sk-view="graph">关系图</button>
      </div>
    </div>
    <div id="skListPane">
      <div class="toolbar">
        <input type="search" id="q" placeholder="搜索名称 / 描述 / skill_id / 分类">
        <select id="fAgent"><option value="">全部 agent</option></select>
        <select id="fState"><option value="">任意状态</option></select>
        <label class="ck"><input type="checkbox" id="fRisk"> 仅风险项</label>
        <button id="clearFilters" class="link">清除筛选</button>
        <span class="grow"></span>
        <span class="note" id="skCount"></span>
        <button id="exportCsv">导出 CSV</button>
      </div>
      <div id="skTable"></div>
      <div class="pager" id="skPager"></div>
      <div class="legend" id="skLegend"></div>
    </div>
    <div id="skGraph" hidden>
      <div class="graph-toolbar">
        <input type="search" id="graphQ" placeholder="搜索 skill / agent / 分组">
        <label class="ck"><input type="checkbox" id="graphOrphans" checked> 孤立节点</label>
        <label class="ck"><input type="checkbox" id="graphGroups" checked> 分组</label>
        <label class="ck"><input type="checkbox" id="graphVersion" checked> 版本</label>
        <label class="ck"><input type="checkbox" id="graphMcp" checked> MCP</label>
        <label class="ck"><input type="checkbox" id="graphLocal"> 仅看关联</label>
        <label class="graph-size">节点直径 <input type="range" id="graphSize" min="10" max="200" step="5" value="40"> <output id="graphSizeVal">40%</output></label>
        <label class="graph-size">发光 <input type="range" id="graphGlow" min="0" max="100" step="5" value="55"> <output id="graphGlowVal">55%</output></label>
        <label class="graph-size">透明度 <input type="range" id="graphAlpha" min="5" max="100" step="5" value="85"> <output id="graphAlphaVal">85%</output></label>
        <button type="button" id="graphReset" class="link">复位视图</button>
        <span id="graphStat" class="note"></span>
      </div>
      <div class="graph-stage">
        <div class="graph-canvas-wrap">
          <canvas id="graphCanvas"></canvas>
          <div id="graphHint" hidden></div>
        </div>
        <aside id="graphInfo"></aside>
      </div>
      <div class="graph-legend">
        <span><i style="background:#7aa2f7"></i>Agent</span>
        <span><i style="background:#c0caf5"></i>Skill</span>
        <span><i style="background:#ff3b30"></i>风险</span>
        <span><i style="background:#0071e3"></i>分组</span>
        <span><i style="background:#bb9af7"></i>MCP</span>
        <span><i style="background:#9ece6a"></i>投影连线</span>
      </div>
    </div>
  </section>
  <section id="tab-im" data-tab="im" hidden></section>
  <section id="tab-gr" data-tab="gr" hidden></section>
  <section id="tab-mc" data-tab="mc" hidden></section>
  <section id="tab-bk" data-tab="bk" hidden></section>
  <section id="tab-md" data-tab="md" hidden></section>
  <section id="tab-lg" data-tab="lg" hidden></section>
</main>

<div id="mask" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="dhead"><h2 id="dTitle"></h2><button id="closeDrawer" aria-label="关闭详情">关闭</button></div>
  <div class="dtabs" id="dTabs" role="tablist"></div>
  <div class="dbody" id="dBody"></div>
</aside>
<div id="toasts" aria-live="polite"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
