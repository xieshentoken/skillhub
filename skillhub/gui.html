<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skillhub 控制台</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#121826; --panel2:#0f1522; --line:#1e293b; --line2:#26324a;
    --text:#e2e8f0; --muted:#8ea0bd; --dim:#5b6b87;
    --accent:#4f8cff; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --gray:#3b4a63;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,"PingFang SC","Helvetica Neue",sans-serif}
  a{color:var(--accent);text-decoration:none}
  header{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;
         gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
  header h1 span{color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:6px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;
        padding:2px 10px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text)}
  .spacer{flex:1}
  button{background:var(--panel);color:var(--text);border:1px solid var(--line2);
         border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent);color:#fff}
  .paths{font:11px var(--mono);color:var(--dim);padding:4px 20px 0}
  nav{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line)}
  nav button{border:none;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);
             padding:8px 16px;font-size:14px;border-bottom:2px solid transparent}
  nav button.active{color:#fff;border-bottom-color:var(--accent);background:var(--panel2)}
  main{padding:18px 20px 60px;max-width:1400px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
  .dotc{width:10px;height:10px;border-radius:50%;flex:none}
  .badge{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 7px;color:var(--muted)}
  .badge.copy{color:var(--amber);border-color:rgba(245,158,11,.4)}
  .badge.warn{color:var(--red);border-color:rgba(239,68,68,.4)}
  .badge.ok{color:var(--green);border-color:rgba(34,197,94,.4)}
  .dir{font:11px var(--mono);color:var(--dim);word-break:break-all;margin:4px 0 10px}
  .nums{display:flex;gap:14px;font-size:13px;margin-bottom:8px}
  .nums b{font-size:17px;margin-right:3px}
  .bar{height:6px;border-radius:4px;background:var(--gray);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .meta{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  input[type=text],select{background:var(--panel2);border:1px solid var(--line2);color:var(--text);
       border-radius:8px;padding:7px 12px;font-size:13px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  input[type=text]{min-width:240px}
  label.ck{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#182136}
  td.mono,span.mono{font:12px var(--mono)}
  .risk{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin:1px 3px 1px 0;
        background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
  .risk.none{background:transparent;color:var(--dim);border-color:var(--line)}
  .sdot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;cursor:default}
  .s-linked{background:var(--green)} .s-conflict{background:var(--amber)} .s-not_linked{background:var(--gray)}
  .s-broken,.s-copy_broken,.s-copy_drift,.s-store_drift{background:var(--red)}
  .desc{color:var(--muted);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 抽屉 */
  #drawer{position:fixed;top:0;right:-560px;width:560px;max-width:94vw;height:100vh;z-index:50;
          background:var(--panel2);border-left:1px solid var(--line2);transition:right .22s ease;
          display:flex;flex-direction:column;box-shadow:-18px 0 50px rgba(0,0,0,.5)}
  #drawer.open{right:0}
  #drawer .dhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  #drawer .dhead h2{margin:0;font-size:16px;flex:1}
  #drawer .dbody{overflow:auto;padding:16px 18px;flex:1}
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
  #mask.show{display:block}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:13px;margin-bottom:16px}
  .kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-all}
  .sect{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px}
  .filelist{font:12px var(--mono);color:var(--muted);max-height:260px;overflow:auto;
            border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
  .filelist div{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
  .projline{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px}
  .projline .mono{color:var(--dim);font-size:11px;word-break:break-all}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
  .note{font-size:12px;color:var(--dim);margin-top:10px}
  .note b{color:var(--muted)}
  .formrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .formrow input,.formrow textarea{background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:6px;padding:6px 8px}
  .formrow textarea{width:100%;min-height:180px;font:12px var(--mono)}
  .choice-grid,.group-members{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .choice-grid{max-height:150px;overflow:auto;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
  .choice-item{padding:2px 5px;border-radius:5px}
  .choice-item:hover{background:var(--panel)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .danger{color:#fca5a5}.success{color:#86efac}
  .diag-list{display:grid;gap:5px;margin:7px 0}
  .smallbtn{padding:3px 8px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>skill<span>hub</span> 控制台</h1>
  <div class="chips" id="chips"></div>
  <div class="spacer"></div>
  <span style="font-size:12px;color:var(--dim)" id="genat"></span>
  <label class="ck"><input type="checkbox" id="autoRefresh"> 15s 自动刷新</label>
  <button id="exportCsv">导出 CSV</button>
  <button id="refresh">↻ 刷新</button>
</header>
<div class="paths" id="paths"></div>
<nav id="tabs">
  <button data-t="ov" class="active">Agent 概览</button>
  <button data-t="sk">中央库 Skills</button>
  <button data-t="mc">MCP Servers</button>
  <button data-t="bk">备份</button>
  <button data-t="mt">导入 / 分组 / 分发</button>
  <button data-t="lg">日志 / 设置 / 模型</button>
</nav>
<main>
  <section id="tab-ov"></section>
  <section id="tab-sk" hidden>
    <div class="toolbar">
      <input type="text" id="q" placeholder="搜索名称 / 描述 / skill_id…">
      <select id="fAgent"><option value="">全部 agent 投影状态</option></select>
      <select id="fState">
        <option value="">任意状态</option>
        <option value="linked">已投影</option>
        <option value="trial">试用 UL</option>
        <option value="conflict">冲突</option>
        <option value="broken">断链</option>
        <option value="store_drift">中央库漂移</option>
        <option value="copy_drift">copy 漂移</option>
        <option value="not_linked">未投影</option>
      </select>
      <label class="ck"><input type="checkbox" id="fRisk"> 仅看有风险的</label>
      <span class="note" id="skCount"></span>
    </div>
    <div id="skTable"></div>
    <p class="note"><b>图例:</b>
      <span class="sdot s-linked"></span>已投影(链接指向中央库)
      <span class="sdot s-conflict"></span>冲突(目标存在但非本库投影)
      <span class="sdot s-not_linked"></span>未投影。点击行看详情与各 agent 目标路径。</p>
  </section>
  <section id="tab-mc" hidden></section>
  <section id="tab-bk" hidden></section>
  <section id="tab-mt" hidden></section>
  <section id="tab-lg" hidden></section>
</main>

<div id="mask"></div>
<div id="drawer">
  <div class="dhead"><h2 id="dTitle"></h2><button id="closeDrawer">✕ 关闭</button></div>
  <div class="dbody" id="dBody"></div>
</div>

<script>
const AGENT_COLORS={pi:"#a78bfa",codex:"#34d399",opencode:"#fbbf24",workbuddy:"#38bdf8",claude:"#f472b6",grok:"#22d3ee",hermes:"#a3e635"};
const STATE_LABEL={linked:"已投影",trial:"试用 UL",conflict:"冲突",not_linked:"未投影",broken:"断链",copy_broken:"copy 断链",copy_drift:"copy 漂移",store_drift:"中央库漂移"};
let DATA=null, TAB="ov", SORT={key:null,dir:1}, MODEL_SUGGESTIONS=[];
let DIST_SELECTION_DIRTY=false, DIST_SELECTION_CONFLICT=false;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtSize=n=>n<0?"":n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
const color=a=>AGENT_COLORS[a]||"#94a3b8";

async function load(){
  try{
    const r=await fetch("/api/data");
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));
    DATA=d;
    renderChips(); renderOverview(); renderSkills(); renderMcp(); renderBackups(); renderMaintenance(); renderLogs();
  }catch(err){
    document.getElementById("tab-ov").innerHTML=`<p class="empty">加载失败: ${esc(err.message)}</p>`;
  }
}

/* ---------- header ---------- */
function renderChips(){
  const s=DATA.summary;
  document.getElementById("chips").innerHTML=
    `<span class="chip">skills <b>${s.skills}</b></span>`+
    `<span class="chip">风险 <b style="color:${s.risky?"#fca5a5":"inherit"}">${s.risky}</b></span>`+
    `<span class="chip">agents <b>${s.agents}</b></span>`+
    `<span class="chip">投影总数 <b style="color:var(--green)">${s.linked_total}</b></span>`+
    `<span class="chip">MCP <b>${s.mcp_servers}</b></span>`+
    `<span class="chip">备份 <b>${s.backups}</b></span>`;
  document.getElementById("genat").textContent="生成于 "+DATA.generated_at;
  const p=DATA.paths;
  document.getElementById("paths").innerHTML=
    `store <span class="mono">${esc(p.store)}</span> · index <span class="mono">${esc(p.index)}</span>`;
}

/* ---------- 概览 ---------- */
function renderOverview(){
  const el=document.getElementById("tab-ov");
  el.innerHTML=`<div class="cards">`+DATA.agents.map(a=>{
    const tot=Math.max(a.total_in_store,1);
    const pct=(n)=>(n/tot*100).toFixed(1)+"%";
    const dirOk=a.dir_exists?`<span class="badge ok">目录存在</span>`:`<span class="badge warn">目录未创建</span>`;
    const mcp=a.mcp_supported?`<span class="badge">MCP: ${esc(a.mcp_target)}</span>`:`<span class="badge">MCP 不支持</span>`;
    return `<div class="card">
      <h3><i class="dotc" style="background:${color(a.name)}"></i>${esc(a.name)}
          <span class="badge ${a.mode==="copy"?"copy":""}">${a.mode}${a.nested?" · nested":""}</span></h3>
      <div class="dir">${esc(a.skill_dir)}</div>
      <div class="nums">
        <span style="color:var(--green)"><b>${a.linked}</b>已投影</span>
        <span style="color:var(--amber)"><b>${a.conflict}</b>冲突</span>
        <span style="color:var(--muted)"><b>${a.not_linked}</b>未投影</span>
        <span style="color:var(--red)"><b>${a.store_drift}</b>中央库漂移</span>
      </div>
      <div class="bar">
        <i style="width:${pct(a.linked)};background:var(--green)"></i>
        <i style="width:${pct(a.conflict)};background:var(--amber)"></i>
      </div>
      <div class="meta">${dirOk} ${mcp} <span class="badge">中央库 ${a.total_in_store} 个</span></div>
    </div>`;
  }).join("")+`</div>
  <p class="note"><b>说明:</b> 已投影 = agent 目录里的条目是指向中央库的软链(symlink 模式)或经标记验证的 copy;
  冲突 = 目标已有非本库内容, 需 --force; broken = 指向本库但中央库副本已缺失；中央库漂移需先修复或重新导入。
  写操作: 在中央库详情里可对单个 agent 执行 投影/解除 (走与 CLI 相同的备份与门禁逻辑);
  批量与导入仍用 CLI (<span class="mono">skillhub link / import</span>)。</p>`;
}

/* ---------- skills ---------- */
function renderSkills(){
  const sel=document.getElementById("fAgent");
  const cur=sel.value;
  sel.innerHTML=`<option value="">全部 agent 投影状态</option>`+
    DATA.agents.map(a=>`<option value="${a.name}">${a.name}</option>`).join("");
  sel.value=cur;
  ["q","fAgent","fState","fRisk"].forEach(id=>{
    const e=document.getElementById(id);
    if(!e._bound){e.addEventListener("input",renderSkillTable);e._bound=1}
  });
  renderSkillTable();
}
function renderSkillTable(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const fa=document.getElementById("fAgent").value, fs=document.getElementById("fState").value;
  const fr=document.getElementById("fRisk").checked;
  let rows=DATA.skills.filter(s=>{
    if(fr&&!s.risks.length)return false;
    if(fs){ if(fa){ if(s.states[fa]!==fs)return false } else if(!Object.values(s.states).includes(fs))return false }
    if(fa&&!fs&&s.states[fa]===undefined)return false;
    if(q&&!((s.name+" "+s.desc+" "+s.id+" "+s.category).toLowerCase().includes(q)))return false;
    return true;
  });
  if(SORT.key){
    const k=SORT.key, d=SORT.dir;
    rows=[...rows].sort((a,b)=>{
      let va,vb;
      if(k==="risks"){va=a.risks.length;vb=b.risks.length}
      else if(k==="size"){va=a.size||0;vb=b.size||0}
      else{va=(a[k]||"").toLowerCase();vb=(b[k]||"").toLowerCase();return va<vb?-d:va>vb?d:0}
      return (va-vb)*d;
    });
  }
  const caret=k=>SORT.key===k?(SORT.dir>0?" ▲":" ▼"):"";
  document.getElementById("skCount").textContent=`${rows.length} / ${DATA.skills.length} 个 skill`;
  document.getElementById("skTable").innerHTML=
   `<table><thead><tr>
      <th data-sort="name" style="cursor:pointer">名称${caret("name")}</th>
      <th data-sort="category" style="cursor:pointer">分类${caret("category")}</th>
      <th>描述</th>
      <th data-sort="risks" style="cursor:pointer">风险${caret("risks")}</th>
      <th data-sort="size" style="cursor:pointer">大小${caret("size")}</th>
      <th>来源 agent</th><th>投影状态</th></tr></thead><tbody>`+
   rows.map(s=>`<tr data-sid="${esc(s.id)}">
     <td class="mono">${esc(s.name)}</td>
     <td style="color:var(--dim)">${esc(s.category)||"—"}</td>
     <td class="desc" title="${esc(s.desc)}">${esc(s.desc)||"—"}</td>
     <td>${s.risks.length?s.risks.map(r=>`<span class="risk">${esc(r)}</span>`).join(""):`<span class="risk none">无</span>`}</td>
     <td class="mono">${fmtSize(s.size||0)}</td>
     <td>${s.source_agents.map(a=>`<span style="color:${color(a)};font-size:12px">${esc(a)}</span>`).join(" ")}</td>
     <td>${DATA.agents.map(a=>{const st=s.states[a.name];
        return st?`<span class="sdot s-${st}" title="${a.name}: ${STATE_LABEL[st]||st}"></span>`:""}).join("")}</td>
   </tr>`).join("")+`</tbody></table>`;
}
function setSort(k){
  if(SORT.key===k)SORT.dir*=-1; else SORT={key:k,dir:1};
  renderSkillTable();
}

/* ---------- skill 详情抽屉 ---------- */
async function openSkill(sid){
  document.getElementById("mask").classList.add("show");
  const dr=document.getElementById("drawer"); dr.classList.add("open");
  document.getElementById("dTitle").textContent=sid;
  const body=document.getElementById("dBody");
  body.innerHTML=`<p class="empty">加载中…</p>`;
  try{
    const r=await fetch("/api/skill/"+encodeURIComponent(sid));
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));
    renderSkillDrawer(sid,d);
  }catch(err){body.innerHTML=`<p class="empty">加载失败: ${esc(err.message)}</p>`}
}
function renderSkillDrawer(sid,d){
  const body=document.getElementById("dBody");
  const m=d.manifest;
  body.innerHTML=`
    <dl class="kv">
      <dt>名称</dt><dd><b>${esc(m.name)}</b></dd>
      <dt>分类</dt><dd>${esc(m.category)||"—"}</dd>
      <dt>描述</dt><dd>${esc(m.fm_desc)||"—"}</dd>
      <dt>风险</dt><dd>${(m.risks||[]).length?m.risks.map(x=>`<span class="risk">${esc(x)}</span>`).join(""):"无标记"}</dd>
      <dt>大小</dt><dd>${fmtSize(m.size||0)}</dd>
      <dt>导入时间</dt><dd>${esc(m.imported_at||"—")}</dd>
      <dt>来源</dt><dd>${(m.sources||[]).map(s=>`${esc(s.agent)} <span class="mono" style="color:var(--dim)">${esc(s.path)}</span>`).join("<br>")}</dd>
      <dt>中央库</dt><dd class="mono" style="color:var(--dim)">${esc(d.store_dir)}</dd>
    </dl>
    <div class="sect">各 agent 投影映射 (可操作)</div>
    ${DATA.agents.map(a=>{const p=d.projections[a.name];
      const st=p.state;
      const isOurs=(st==="linked"||st==="copy"||st==="broken");
      const act=isOurs?"unlink":"link";
      const needF=(act==="link"&&st==="conflict");
      const lbl=isOurs?"解除":(needF?"投影(替换)":"投影");
      return `<div class="projline">
        <span class="sdot s-${st}" title="${STATE_LABEL[st]||st}"></span>
        <span style="color:${color(a.name)};width:86px;flex:none">${esc(a.name)}</span>
        <span class="mono" style="flex:1">${esc(p.target)}</span>
        <button style="padding:2px 10px;font-size:12px"
                data-proj-sid="${esc(sid)}" data-proj-agent="${esc(a.name)}" data-proj-state="${esc(st)}">${lbl}</button></div>`}).join("")}
    <p class="note">投影走正常备份/冲突/风险门禁流程; 冲突项会先确认再备份替换; broken 需先修复中央库。</p>
    <div class="sect">版本与维护</div>
    <div class="formrow">
      ${m.channel==="ul"?`<button class="smallbtn" data-refresh-ul-sid="${esc(sid)}">刷新外部编辑摘要</button><button class="smallbtn" data-publish-sid="${esc(sid)}">预览并发布为正式版</button>`:`<button class="smallbtn" data-create-ul-sid="${esc(sid)}">创建独立 ul 试用版</button>`}
      ${(m.ul_sid||m.formal_sid)?`<button class="smallbtn" data-diff-sid="${esc(sid)}" data-diff-with="${esc(m.channel==="ul"?m.formal_sid:m.ul_sid)}">查看版本差异</button>`:""}
      <input id="rename-${esc(sid)}" placeholder="新名称" value="${esc(m.name)}" style="max-width:190px">
      <button class="smallbtn" data-rename-sid="${esc(sid)}">预览改名</button>
    </div>
    ${m.channel==="ul"?`<p class="note">ul 是独立副本，只能编辑文本文件；保存或外部编辑后刷新会重算完整摘要和 content id。明文外部编辑完成后先刷新，再发布。</p>`:
      `<p class="note">正式版可创建一个独立 ul；正式版与 ul 的关系只保留各一个。</p>`}

async function postPreviewThenApply(url,payload,label){
  const preview=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,apply:false})});
  const pd=await preview.json();
  if(!preview.ok||pd.error)throw new Error(pd.error||"预览失败");
  if(!confirm(`${label}\n\n${JSON.stringify(pd,null,2).slice(0,1800)}\n\n确认执行？`))return null;
  const applied=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,apply:true,confirm:true})});
  const ad=await applied.json();
  if(!applied.ok||ad.error)throw new Error(ad.error||"执行失败");
  return ad;
}

/* ---------- 写操作: 投影 / 解除 ---------- */
async function proj(sid, agent, state){
  const isOurs=["linked","broken","copy_broken"].includes(state);
  const act=isOurs?"unlink":"link";
  let force=false;
  if(act==="unlink" && !confirm(`解除 ${agent} 上的投影?\n(只移除投影, 不动中央库副本)`)) return;
  if(act==="link" && state==="conflict" &&
     !confirm(`${agent} 上已有非本库内容, 将先备份到 backups/ 再替换, 继续?`)) return;
  if(act==="link" && state==="conflict") force=true;
  if(act==="link" && state==="copy_drift" &&
     !confirm(`${agent} 上的 copy 已被修改, 将备份后替换, 继续?`)) return;
  if(act==="link" && state==="copy_drift") force=true;
  if(act==="link" && ["broken","copy_broken"].includes(state)){
    alert("中央库副本已缺失 (悬空链接), 请先 import 或 rollback 修复中央库。");
    return;
  }
  if(state==="store_drift"){
    alert("中央库副本与索引摘要不一致，请先恢复或重新导入中央库。");
    return;
  }
  try{
    const r=await fetch("/api/"+act,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sid, agents:[agent], force, apply:true})});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));
    const acts=(d.actions&&d.actions[agent])||[];
    const bad=acts.filter(a=>["error","conflict","copy_drift","store_drift","blocked","broken"].includes(a.type));
    if(bad.length)alert("未完成: "+bad.map(a=>a.detail).join("; "));
    await load();
    openSkill(sid);
  }catch(err){alert("失败: "+err.message)}
}

/* ---------- CSV 导出 ---------- */
function exportCsv(){
  const agents=DATA.agents.map(a=>a.name);
  const head=["id","name","category","risks","source_agents",...agents.map(a=>a+"_state")];
  const lines=[head.join(",")];
  DATA.skills.forEach(s=>{
    const row=[s.id,s.name,s.category,s.risks.join("|"),s.source_agents.join("|"),
               ...agents.map(a=>s.states[a]||"")];
    lines.push(row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="skillhub-skills.csv";
  a.click();
}

  const trashHtml=`<div class="sect">单 skill 回收区（默认保留 ${esc(DATA.settings?.trash_retention_days||7)} 天）</div>`+
    (trash.length?`<table><thead><tr><th>回收项</th><th>skill</th><th>原因</th><th>截止</th><th>操作</th></tr></thead><tbody>`+
      trash.map(t=>`<tr><td class="mono">${esc(t.id)}</td><td>${esc(t.name||t.sid||"")}</td><td>${esc(t.reason||"")}${t.retained?` <span class="badge ok">已保留</span>`:""}</td><td>${esc(t.retain_until||t.error||"")}</td><td>${t.valid?`<button class="smallbtn" data-trash-restore="${esc(t.id)}">恢复</button><button class="smallbtn" data-trash-retain="${esc(t.id)}" data-trash-retained="${t.retained?"false":"true"}">${t.retained?"取消保留":"保留"}</button>`:"不可验证"}</td></tr>`).join("")+`</tbody></table>`:`<p class="note">回收区为空。</p>`)+
    `<div class="formrow"><button data-trash-cleanup>预览并清理到期项</button></div>`;
  el.innerHTML=`<div class="panel"><h3>备份快照</h3>${backupRows?`<table><thead><tr><th>时间戳</th><th>大小</th><th>内容</th><th>恢复</th></tr></thead><tbody>${backupRows}</tbody></table>`:`<p class="empty">还没有备份。</p>`}
    <div class="formrow"><label>保留最近 <input id="backupKeep" type="number" min="1" max="10000" value="3" style="width:80px"> 份</label><button data-backup-cleanup>预览清理旧备份</button></div>
    <p class="note">标准快照可在此恢复；发布快照只用于定位下方对应的单 skill 回收项。备份目录 <span class="mono">${esc(DATA.paths.backups)}</span></p></div>
    <div class="panel">${trashHtml}</div>`;
}

/* ---------- 导入 / 分组 / 分发 ---------- */
function renderMaintenance(){
  const el=document.getElementById("tab-mt");
  const sourceRows=(DATA.sources||[]).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.agent)}</td><td class="mono">${esc(s.path)}</td><td>${s.error?`<span class="danger">${esc(s.error)}</span>`:`<button class="smallbtn" data-import-agent="${esc(s.agent)}" data-import-path="${esc(s.path)}">预览导入</button>`}</td></tr>`).join("");
  const groups=Object.entries(DATA.groups||{});
  const skillChoices=(selector)=>DATA.skills.map(s=>`<label class="ck choice-item" draggable="true" data-drag-sid="${esc(s.id)}" data-search="${esc((s.name+" "+s.desc).toLowerCase())}"><input type="checkbox" ${selector(s)}>${esc(s.name)} <span class="mono">${esc(s.channel||"formal")}</span></label>`).join("");
  const groupRows=groups.map(([gid,g])=>`<div class="panel group-editor" data-group-editor="${esc(gid)}" data-drop-group="${esc(gid)}">
    <div class="formrow"><input type="text" data-group-name value="${esc(g.name||gid)}" style="max-width:240px"><span class="badge">${esc(g.kind||"manual")}</span><span class="note">内部关系已保存，成员可在下方调整</span><button class="smallbtn" data-save-group="${esc(gid)}">预览保存分组</button><button class="smallbtn" data-delete-group="${esc(gid)}">预览删除</button></div>
    <div class="group-members">${DATA.skills.map(s=>`<label class="ck"><input type="checkbox" data-group-member data-group-id="${esc(gid)}" data-sid="${esc(s.id)}" ${(g.members||[]).includes(s.id)?"checked":""}>${esc(s.name)} <span class="mono">${esc(s.channel||"formal")}</span></label>`).join("")||`<span class="note">暂无 skill</span>`}</div>
    <div class="note">已保存成员：${(g.members||[]).map(s=>esc((DATA.skills.find(x=>x.id===s)||{}).name||s)).join("、")||"空组"}。取消勾选即可移出成员，也可改名后保存。</div>
  </div>`).join("")||`<p class="note">暂无分组。先用名称创建一个分组。</p>`;
  const distGroupChoices=groups.map(([gid,g])=>`<label class="ck choice-item" data-search="${esc((g.name||gid).toLowerCase())}"><input type="checkbox" data-dist-group="${esc(gid)}">${esc(g.name||gid)} <span class="note">已保存 ${(g.members||[]).length} 个 skill</span></label>`).join("")||`<span class="note">暂无分组</span>`;
  const distSkillChoices=DATA.skills.map(s=>`<label class="ck choice-item" data-search="${esc((s.name+" "+s.desc).toLowerCase())}"><input type="checkbox" data-dist-sid="${esc(s.id)}">${esc(s.name)} <span class="mono">${esc(s.channel||"formal")}</span></label>`).join("")||`<span class="note">暂无 skill</span>`;
  el.innerHTML=`<div class="panel"><h3>来源与同名版本</h3><p class="note">来源来自可发现的 agent 目录；同名不同摘要会共存，可先导入、再在 Skills 详情中比较/改名。导入写入前会先预览。</p><table><thead><tr><th>名称</th><th>来源</th><th>路径</th><th>操作</th></tr></thead><tbody>${sourceRows||`<tr><td colspan="4">没有可导入来源</td></tr>`}</tbody></table></div>
  <div class="panel"><h3>分组</h3><div class="formrow"><input id="groupName" placeholder="新分组名称"><button data-create-group>用勾选 skill 创建分组</button></div><div class="formrow"><input id="createSkillSearch" placeholder="搜索要加入新分组的 skill"><div id="createSkillChoices" class="choice-grid">${skillChoices(s=>`data-create-group-sid="${esc(s.id)}"`)}</div></div>${groupRows}</div>
  <div class="panel"><h3>分发（仅在明确确认后写 agent）</h3><p class="note">按名称选择已保存分组或单个 skill；不需要记住 group id / skill id。来源选择会按 agent 保存，选择 agent 后自动回填。分组成员变化不会自动写 agent，下一次预览会按当前分组成员和仍保存的单个 skill 重新计算。</p><div class="formrow"><input id="distGroupSearch" placeholder="搜索分组名称"><div id="distGroupChoices" class="choice-grid">${distGroupChoices}</div></div><div id="distGroupSelected" class="note">已选分组：无</div><div class="formrow"><input id="distSkillSearch" placeholder="搜索单个 skill 名称或描述"><div id="distSkillChoices" class="choice-grid">${distSkillChoices}</div></div><div id="distSkillSelected" class="note">已选 skill：无</div><div class="formrow">${DATA.agents.map(a=>`<label class="ck"><input type="checkbox" data-dist-agent="${esc(a.name)}">${esc(a.name)}</label>`).join("")}<label class="ck"><input type="checkbox" id="distReplace">按选择移除不再需要的本库投影</label><button data-distribute>预览分发</button></div><div id="distSaved" class="note">选择 agent 后显示已保存来源选择。</div><div id="distProjection" class="note">当前投影结果：选择 agent 后显示。</div><p class="note">去重按投影目标；多 agent 的已保存来源不同会明确提示，需先手动选出一套共同来源再预览。非 skillhub 管理项不会被移除。</p></div>`;
  const bindSearch=(inputId,containerId)=>{const input=document.getElementById(inputId),container=document.getElementById(containerId);if(!input||!container)return;input.addEventListener("input",()=>{const q=input.value.trim().toLowerCase();container.querySelectorAll(".choice-item").forEach(item=>{item.style.display=!q||item.dataset.search.includes(q)?"":"none"})})};
  bindSearch("createSkillSearch","createSkillChoices"); bindSearch("distGroupSearch","distGroupChoices"); bindSearch("distSkillSearch","distSkillChoices");
  DIST_SELECTION_DIRTY=false; DIST_SELECTION_CONFLICT=false; syncDistributionSelection();
}
document.getElementById("tab-mt").addEventListener("click",e=>{
  const imp=e.target.closest("[data-import-agent]");
  if(imp){(async()=>{try{const ad=await postPreviewThenApply("/api/skill/import",{agent:imp.dataset.importAgent,path:imp.dataset.importPath},"导入来源 skill");if(ad)load()}catch(err){alert(err.message)}})();return}
  const create=e.target.closest("[data-create-group]");
  if(create){(async()=>{try{const gid=document.getElementById("groupName").value.trim();const members=[...document.querySelectorAll("[data-create-group-sid]:checked")].map(x=>x.dataset.createGroupSid);if(!gid){alert("请填写分组名称");return}const ad=await postPreviewThenApply("/api/groups",{group_id:gid,members,name:gid,kind:"manual"},"创建分组关系");if(ad)load()}catch(err){alert(err.message)}})();return}
  const saveGroup=e.target.closest("[data-save-group]");
  if(saveGroup){(async()=>{try{const row=saveGroup.closest("[data-group-editor]");const gid=saveGroup.dataset.saveGroup;const members=[...row.querySelectorAll("[data-group-member]:checked")].map(x=>x.dataset.sid);const old=DATA.groups[gid]||{};const name=row.querySelector("[data-group-name]").value.trim()||gid;const ad=await postPreviewThenApply("/api/groups",{group_id:gid,members,name,kind:old.kind||"manual",description:old.description||""},"保存分组成员与名称");if(ad)load()}catch(err){alert(err.message)}})();return}
  const deleteGroup=e.target.closest("[data-delete-group]");
  if(deleteGroup){(async()=>{try{const ad=await postPreviewThenApply("/api/groups/delete",{group_id:deleteGroup.dataset.deleteGroup},"删除分组（不删除 skill）");if(ad)load()}catch(err){alert(err.message)}})();return}
  const dist=e.target.closest("[data-distribute]");
  if(dist){(async()=>{try{const agents=[...document.querySelectorAll("[data-dist-agent]:checked")].map(x=>x.dataset.distAgent);const groups=[...document.querySelectorAll("[data-dist-group]:checked")].map(x=>x.dataset.distGroup);const sids=[...document.querySelectorAll("[data-dist-sid]:checked")].map(x=>x.dataset.distSid);if(!agents.length){alert("请先选择至少一个目标 agent");return}if(DIST_SELECTION_CONFLICT&&!DIST_SELECTION_DIRTY){alert("选中 agent 的已保存来源不同，请先手动选出一套共同的分组/skill 后再预览");return}if(!groups.length&&!sids.length&&!DIST_SELECTION_DIRTY){alert("请至少选择一个分组或单个 skill；若要清空来源，请先取消勾选后再预览");return}const ad=await postPreviewThenApply("/api/distribute",{agents,groups,sids,replace:document.getElementById("distReplace").checked},"预览并分发已选择的 skill");if(ad)load()}catch(err){alert(err.message)}})()}
});
function savedDistributionSource(agent){
  const raw=(DATA.distribution_sources||{})[agent]||{};
  return {groups:Array.isArray(raw.groups)?raw.groups:[],sids:Array.isArray(raw.sids)?raw.sids:[],replace:!!raw.replace};
}
function distributionSourceKey(source){return JSON.stringify({groups:[...(source.groups||[])].sort(),sids:[...(source.sids||[])].sort(),replace:!!source.replace})}
function syncDistributionSelection(){
  const agents=[...document.querySelectorAll("[data-dist-agent]:checked")].map(x=>x.dataset.distAgent);
  const sources=agents.map(savedDistributionSource);
  DIST_SELECTION_CONFLICT=sources.length>1&&sources.some(source=>distributionSourceKey(source)!==distributionSourceKey(sources[0]));
  if(agents.length===1 || (agents.length>1&&!DIST_SELECTION_CONFLICT)){
    const source=sources[0]||{groups:[],sids:[],replace:false};
    document.querySelectorAll("[data-dist-group]").forEach(x=>{x.checked=source.groups.includes(x.dataset.distGroup)});
    document.querySelectorAll("[data-dist-sid]").forEach(x=>{x.checked=source.sids.includes(x.dataset.distSid)});
    const replace=document.getElementById("distReplace"); if(replace)replace.checked=source.replace;
    DIST_SELECTION_DIRTY=false;
  }else if(DIST_SELECTION_CONFLICT){
    document.querySelectorAll("[data-dist-group],[data-dist-sid]").forEach(x=>{x.checked=false});
    const replace=document.getElementById("distReplace"); if(replace)replace.checked=false;
    DIST_SELECTION_DIRTY=false;
  }else if(!agents.length){
    document.querySelectorAll("[data-dist-group],[data-dist-sid]").forEach(x=>{x.checked=false});
    const replace=document.getElementById("distReplace"); if(replace)replace.checked=false;
    DIST_SELECTION_DIRTY=false;
  }
  updateDistributionSummary();
}
function updateDistributionSummary(){
  const groupNames=[...document.querySelectorAll("[data-dist-group]:checked")].map(x=>{const g=DATA.groups[x.dataset.distGroup]||{};return g.name||x.dataset.distGroup});
  const skillNames=[...document.querySelectorAll("[data-dist-sid]:checked")].map(x=>(DATA.skills.find(s=>s.id===x.dataset.distSid)||{}).name||x.dataset.distSid);
  const agents=[...document.querySelectorAll("[data-dist-agent]:checked")].map(x=>x.dataset.distAgent);
  const groupEl=document.getElementById("distGroupSelected"),skillEl=document.getElementById("distSkillSelected"),savedEl=document.getElementById("distSaved"),projectionEl=document.getElementById("distProjection");
  if(groupEl)groupEl.textContent="当前选择分组："+(groupNames.join("、")||"无");
  if(skillEl)skillEl.textContent="当前选择 skill："+(skillNames.join("、")||"无");
  if(savedEl){
    if(!agents.length)savedEl.textContent="选择 agent 后显示已保存来源选择。";
    else if(DIST_SELECTION_CONFLICT)savedEl.textContent="已选 agent 的保存来源不同；当前未自动合并，请手动选出共同来源后再预览。";
    else savedEl.textContent="已保存来源："+agents.map(agent=>{const source=savedDistributionSource(agent);const groups=(source.groups||[]).map(gid=>(DATA.groups[gid]||{}).name||`已删除分组:${gid}`);const sids=(source.sids||[]).map(sid=>(DATA.skills.find(s=>s.id===sid)||{}).name||`已删除 skill:${sid}`);return `${agent} [分组:${groups.join("、")||"无"}; skill:${sids.join("、")||"无"}; replace:${source.replace?"是":"否"}]`}).join("；");
    if(DIST_SELECTION_DIRTY)savedEl.textContent+="（当前选择已修改，确认后会覆盖选中 agent 的来源）";
  }
  if(projectionEl){const saved=DATA.skills.filter(s=>agents.some(agent=>["linked","trial"].includes(s.states?.[agent]))).map(s=>s.name);projectionEl.textContent="当前投影结果："+(saved.join("、")||"无");}
}
document.getElementById("tab-mt").addEventListener("change",e=>{
  if(e.target.matches("[data-dist-agent]")){syncDistributionSelection();return}
  if(e.target.matches("[data-dist-group],[data-dist-sid],#distReplace")){DIST_SELECTION_DIRTY=true;updateDistributionSummary()}
});
document.getElementById("tab-mt").addEventListener("dragstart",e=>{
  const item=e.target.closest("[data-drag-sid]"); if(item)e.dataTransfer.setData("text/plain",item.dataset.dragSid);
});
document.getElementById("tab-mt").addEventListener("dragover",e=>{if(e.target.closest("[data-drop-group]"))e.preventDefault()});
document.getElementById("tab-mt").addEventListener("drop",e=>{
  const target=e.target.closest("[data-drop-group]"); if(!target)return; e.preventDefault();
  const sid=e.dataTransfer.getData("text/plain"), gid=target.dataset.dropGroup, old=DATA.groups[gid]||{};
  if(!sid||((old.members||[]).includes(sid)))return;
  (async()=>{try{const ad=await postPreviewThenApply("/api/groups",{group_id:gid,members:[...(old.members||[]),sid],name:old.name||gid,kind:old.kind||"manual"},"将 skill 拖入分组");if(ad)load()}catch(err){alert(err.message)}})();
});

/* ---------- 日志 / 设置 / 模型 ---------- */
function renderLogs(){
  const el=document.getElementById("tab-lg");
  const modelRows=(DATA.models?.agents||[]).map(m=>`<tr><td>${esc(m.agent)}</td><td>${m.available?esc(m.models.join(", ")):"—"}</td><td>${esc(m.reason)}</td></tr>`).join("");
  const logs=(DATA.logs||[]).slice().reverse().map(x=>`<tr><td class="mono">${esc(x.at)}</td><td>${esc(x.event)}</td><td>${esc(x.status)}</td><td class="mono">${esc(x.sid||"")}</td></tr>`).join("");
  const callable=(DATA.models?.agents||[]).filter(m=>m.callable&&m.models?.length);
  const choices=callable.map(m=>`<option value="${esc(m.agent)}" data-models="${esc(JSON.stringify(m.callable_models||m.models))}">${esc(m.agent)}</option>`).join("");
  el.innerHTML=`<div class="panel"><h3>模型发现与分组建议</h3><p class="note">只读取实际配置；调用只在用户点击后发生，向模型发送的字段严格是 skill 名称和描述。结果先展示，批量/单项接受都要再次确认；人工分组不会被覆盖，模型失败不会改组。</p><div class="formrow"><select id="modelAgent">${choices||`<option value="">没有可安全调用的本机模型</option>`}</select><select id="modelName"></select><button data-model-suggest ${callable.length?"":"disabled"}>生成分组建议</button></div><div class="formrow">${DATA.skills.map(s=>`<label class="ck"><input type="checkbox" data-model-sid="${esc(s.id)}">${esc(s.name)} <span class="mono">${esc(s.channel||"formal")}</span></label>`).join("")}</div><div id="modelSuggestions"></div><table><thead><tr><th>agent</th><th>模型</th><th>限制</th></tr></thead><tbody>${modelRows||`<tr><td colspan="3">无</td></tr>`}</tbody></table></div>
  <div class="panel"><h3>设置</h3><div class="formrow"><label>回收保留天数 <input id="retentionDays" type="number" min="1" value="${esc(DATA.settings?.trash_retention_days||7)}"></label><button data-save-settings>预览并保存</button></div><p class="note">设置保存是明确写操作；GUI 启动/刷新不会自动清理回收区。</p></div>
  <div class="panel"><h3>审计日志</h3><table><thead><tr><th>时间</th><th>事件</th><th>状态</th><th>skill</th></tr></thead><tbody>${logs||`<tr><td colspan="4">暂无日志</td></tr>`}</tbody></table></div>`;
  const agentSelect=document.getElementById("modelAgent");
  const updateModels=()=>{const selected=callable.find(m=>m.agent===agentSelect?.value);const modelSelect=document.getElementById("modelName");if(modelSelect)modelSelect.innerHTML=(selected?.callable_models||selected?.models||[]).map(x=>`<option>${esc(x)}</option>`).join("")};
  if(agentSelect){agentSelect.addEventListener("change",updateModels);updateModels()}
  renderModelSuggestions();
}
function renderModelSuggestions(){
  const el=document.getElementById("modelSuggestions"); if(!el)return;
  if(!MODEL_SUGGESTIONS.length){el.innerHTML="";return}
  el.innerHTML=`<div class="sect">待确认建议</div><div class="formrow"><button data-model-accept-all>确认接受全部建议</button></div>`+
    MODEL_SUGGESTIONS.map((s,i)=>`<div class="panel"><b>${esc(s.name)}</b><span class="note"> ${(s.members||[]).map(id=>esc((DATA.skills.find(x=>x.id===id)||{}).name||id)).join("、")}</span><div class="formrow"><button class="smallbtn" data-model-accept="${i}">接受此组</button><button class="smallbtn" data-model-adjust="${i}">调整名称后接受</button></div></div>`).join("");
}
document.getElementById("tab-lg").addEventListener("click",e=>{
  const suggest=e.target.closest("[data-model-suggest]");
  if(suggest){(async()=>{try{const sids=[...document.querySelectorAll("[data-model-sid]:checked")].map(x=>x.dataset.modelSid);if(!sids.length){alert("先选择要分组的 skill");return}const r=await fetch("/api/models/suggest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({agent:document.getElementById("modelAgent").value,model:document.getElementById("modelName").value,sids})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||"模型建议失败");MODEL_SUGGESTIONS=d.suggestions||[];renderModelSuggestions()}catch(err){alert("模型建议未应用："+err.message)}})();return}
  const acceptAll=e.target.closest("[data-model-accept-all]");
  if(acceptAll){(async()=>{try{const ad=await postPreviewThenApply("/api/model-groups",{suggestions:MODEL_SUGGESTIONS},"批量接受模型分组建议");if(ad){MODEL_SUGGESTIONS=[];load()}}catch(err){alert(err.message)}})();return}
  const accept=e.target.closest("[data-model-accept]");
  if(accept){(async()=>{try{const ad=await postPreviewThenApply("/api/model-groups",{suggestions:[MODEL_SUGGESTIONS[Number(accept.dataset.modelAccept)]]},"接受单个模型分组建议");if(ad){MODEL_SUGGESTIONS.splice(Number(accept.dataset.modelAccept),1);renderModelSuggestions();load()}}catch(err){alert(err.message)}})();return}
  const adjust=e.target.closest("[data-model-adjust]");
  if(adjust){const i=Number(adjust.dataset.modelAdjust);const copy={...MODEL_SUGGESTIONS[i],name:prompt("调整组名",MODEL_SUGGESTIONS[i].name)||MODEL_SUGGESTIONS[i].name};(async()=>{try{const ad=await postPreviewThenApply("/api/model-groups",{suggestions:[copy]},"确认应用调整后的模型分组");if(ad){MODEL_SUGGESTIONS.splice(i,1);renderModelSuggestions();load()}}catch(err){alert(err.message)}})();return}
  const save=e.target.closest("[data-save-settings]");
  if(save){(async()=>{try{const ad=await postPreviewThenApply("/api/settings",{settings:{trash_retention_days:Number(document.getElementById("retentionDays").value)}},"保存 skillhub 设置");if(ad)load()}catch(err){alert(err.message)}})()}
});

/* ---------- tabs ---------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  TAB=b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));
  ["ov","sk","mc","bk","mt","lg"].forEach(t=>document.getElementById("tab-"+t).hidden=(t!==TAB));
  if(TAB==="sk")renderSkillTable();
});

load();
</script>
</body>
